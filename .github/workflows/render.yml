name: render
run-name: render ${{ inputs.run_key }}
on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: "base64 JSON (topic_title, files, script, out)"
        required: true
      run_key:
        required: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - name: Decode payload
        run: |
          mkdir work
          echo '${{ inputs.payload_b64 }}' | base64 -d > work/payload.json
      - name: Fetch files
        run: |
          cd work
          jq -r '.script' payload.json > run.sh
          jq -c '.files[]' payload.json | while read -r f; do
            curl -fsSL "$(echo "$f" | jq -r .url)" -o "$(echo "$f" | jq -r .name)"
          done
      - name: Render
        run: cd work && bash run.sh
      - name: Output
        run: |
          cd work
          OUT=$(jq -r '.out' payload.json)
          mkdir ../result && cp "$OUT" ../result/
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.run_key }}
          path: result/*
          retention-days: 1
